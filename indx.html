<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Connect - 맞춤형 필터 추천 & 마음함</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .musical-card {
            background-color: #ffffff;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .musical-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 30px -5px rgb(0 0 0 / 0.08), 0 10px 15px -6px rgb(0 0 0 / 0.08);
        }
        .active-filter {
            background-color: #6366f1;
            color: white;
            border-color: #6366f1;
        }
        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }
        .filter-dropdown {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .filter-group:hover .filter-dropdown {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .info-overlay {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease-out;
        }
        .musical-card:hover .info-overlay {
            opacity: 1;
            transform: translateY(0);
        }
        .heart-btn {
            transition: transform 0.2s ease;
        }
        .heart-btn:active {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">MUSICAL <span class="text-indigo-600">CONNECT</span></h1>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-4 top-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <!-- 마음함 버튼 -->
                <button id="wishlistToggle" class="flex items-center gap-2 bg-pink-50 text-pink-600 px-4 py-2 rounded-full text-sm font-bold border border-pink-100 hover:bg-pink-100 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" id="wishlistIcon" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                    <span>마음함</span>
                    <span id="wishlistCount" class="bg-pink-600 text-white text-[10px] px-1.5 py-0.5 rounded-full min-w-[18px]">0</span>
                </button>

                <!-- 필터 더보기 -->
                <div class="relative filter-group">
                    <button class="flex items-center gap-2 bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full text-sm font-bold border border-indigo-100 hover:bg-indigo-100 transition-all">
                        <span>필터</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <div class="filter-dropdown absolute right-0 mt-2 w-[300px] md:w-[400px] bg-white border border-slate-200 rounded-3xl shadow-2xl p-6 z-50">
                        <div class="mb-5">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">장르별 찾기</p>
                            <div class="flex flex-wrap gap-2" id="genreContainer">
                                <button class="filter-btn active-filter px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-100" data-type="genre" data-value="all">전체</button>
                                <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-100 hover:bg-slate-50" data-type="genre" data-value="로맨스">로맨스</button>

                        </div>
                        <div>

                            <div class="flex flex-wrap gap-2" id="ageContainer">
                                <button class="filter-btn active-filter px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-100" data-type="age" data-value="all">전체</button>
                                <button class="filter-btn px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-100 hover:bg-slate-50" data-type="age" data-value="전연령">전연령 추천</button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

            </div>
        </div>

        <div id="musicalGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Cards injected here -->
        </div>

        <div id="noResults" class="hidden text-center py-24">
            <div class="bg-white p-12 rounded-[40px] shadow-sm border border-slate-100 inline-block mx-auto">
                <div class="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <p class="text-xl font-bold text-slate-800 mb-2">공연을 찾을 수 없습니다</p>
                <p class="text-slate-400 text-sm">필터를 변경하거나 마음함에 공연을 담아보세요.</p>
                <button id="resetFiltersBtn" class="mt-6 text-indigo-600 font-bold text-sm hover:underline">초기화하기</button>
            </div>
        </div>
    </main>

        <div class="modal-overlay absolute inset-0"></div>
        <div class="bg-white border border-slate-200 w-full max-w-3xl rounded-3xl overflow-hidden relative z-10 shadow-2xl">
            <button id="closeModal" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900 z-30 bg-white/80 hover:bg-white rounded-full p-1 shadow-sm transition-all border border-slate-100">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

            { id: 12, title: "하데스타운", category: "라이선스", genre: "드라마 / 판타지", image: "https://images.unsplash.com/photo-1514525253361-bee8738009a7?q=80&w=800&auto=format&fit=crop", description: "오르페우스와 에우리디케 신화를 현대적으로 재해석한 작품. 독창적인 재즈 음악과 시적인 연출이 돋보이는 수작.", venue: "샤롯데씨어터", duration: "155분", targetAge: ["2030"], bookingUrl: "https://tickets.interpark.com/search?keyword=하데스타운" },
            { id: 13, title: "빌리 엘리어트", category: "라이선스", genre: "드라마 / 코미디", image: "https://images.unsplash.com/photo-1508700915892-45ecd05ae2ad?q=80&w=800&auto=format&fit=crop", description: "광산촌 소년 빌리가 발레를 통해 꿈을 향해 나아가는 이야기. 소년 배우들의 폭발적인 에너지를 느껴보세요.", venue: "대성 디큐브아트센터", duration: "160분", targetAge: ["전연령", "10대"], bookingUrl: "https://tickets.interpark.com/search?keyword=빌리엘리어트" },
            { id: 14, title: "킹키부츠", category: "라이선스", genre: "코미디 / 드라마", image: "https://images.unsplash.com/photo-1496293455970-f8581aae0e3c?q=80&w=800&auto=format&fit=crop", description: "폐업 위기 공장을 물려받은 찰리가 드랙퀸 롤라를 만나 성공하는 유쾌한 드라마.", venue: "충무아트센터", duration: "155분", targetAge: ["2030", "10대"], bookingUrl: "https://tickets.interpark.com/search?keyword=킹키부츠" },
            { id: 15, title: "시라노", category: "라이선스", genre: "로맨스 / 드라마", image: "https://images.unsplash.com/photo-1464375117522-1311d6a5b81f?q=80&w=800&auto=format&fit=crop", description: "커다란 코를 가진 검객 시라노가 록산을 향한 지독한 짝사랑을 대신 고백하며 벌어지는 이야기.", venue: "예술의전당", duration: "170분", targetAge: ["2030", "4050"], bookingUrl: "https://tickets.interpark.com/search?keyword=시라노" },
            { id: 16, title: "마틸다", category: "라이선스", genre: "판타지 / 코미디", image: "https://images.unsplash.com/photo-1503095396549-807a89ad1716?q=80&w=800&auto=format&fit=crop", description: "특별한 능력을 가진 소녀 마틸다가 독재적인 교장에게 맞서 자신의 삶을 찾아가는 가족 뮤지컬.", venue: "대성 디큐브아트센터", duration: "160분", targetAge: ["전연령", "10대"], bookingUrl: "https://tickets.interpark.com/search?keyword=마틸다" },
            { id: 17, title: "물랑루즈!", category: "라이선스", genre: "로맨스 / 드라마", image: "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?q=80&w=800&auto=format&fit=crop", description: "19세기 파리, 젊은 시인 크리스티앙과 무희 사틴의 운명적인 사랑을 화려한 팝 음악과 함께 그린 대작.", venue: "블루스퀘어", duration: "165분", targetAge: ["2030"], bookingUrl: "https://tickets.interpark.com/search?keyword=물랑루즈" },
            { id: 18, title: "엘리자벳", category: "라이선스", genre: "역사 / 판타지", image: "https://images.unsplash.com/photo-1543157145-f78c636d023d?q=80&w=800&auto=format&fit=crop", description: "황후 엘리자벳과 그녀를 유혹하는 '죽음(Tod)'의 치명적인 사랑과 고뇌.", venue: "세종문화회관", duration: "170분", targetAge: ["2030", "4050"], bookingUrl: "https://tickets.interpark.com/search?keyword=엘리자벳" }
        ];

        let state = {
            currentGenre: 'all',
            currentAge: 'all',
            searchQuery: '',
            showWishlistOnly: false,
            wishlist: new Set(),
            userId: null
        };

        const initializeFirebaseApp = async () => {
            // YOUR_API_KEY_HERE 부분을 실제 키로 바꾸지 않으면 로컬 스토리지만 작동하게끔 예외처리를 하거나 안내할 수 있습니다.
            if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
                console.warn("Firebase API Key가 설정되지 않았습니다. 찜하기 기능이 저장되지 않을 수 있습니다.");
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // 익명 로그인
                await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        state.userId = user.uid;
                        setupWishlistSync();
                    }
                });
            } catch (error) {
                console.error("Firebase 초기화 오류:", error);
            }
        };

        const setupWishlistSync = () => {
            if (!state.userId || !db) return;
            // 보안 규칙에 맞는 고정 경로 사용
            const wishlistDocRef = doc(db, 'artifacts', appId, 'users', state.userId, 'data', 'wishlist');
            
            onSnapshot(wishlistDocRef, (snapshot) => {
                if (snapshot.exists()) {
                    state.wishlist = new Set(snapshot.data().itemIds || []);
                } else {
                    state.wishlist = new Set();
                }
                updateWishlistUI();
                renderMusicals();
            }, (error) => console.error("데이터 동기화 오류:", error));
        };

        const updateWishlistInDb = async () => {
            if (!state.userId || !db) return;
            const wishlistDocRef = doc(db, 'artifacts', appId, 'users', state.userId, 'data', 'wishlist');
            try {
                await setDoc(wishlistDocRef, { itemIds: Array.from(state.wishlist) });
            } catch (error) {
                console.error("저장 오류:", error);
            }
        };

        const renderMusicals = () => {
            const musicalGrid = document.getElementById('musicalGrid');
            const noResults = document.getElementById('noResults');
            const viewTitle = document.getElementById('viewTitle');
            const viewSubtitle = document.getElementById('viewSubtitle');

            const filtered = musicals.filter(m => {
                const matchesGenre = state.currentGenre === 'all' || m.genre.includes(state.currentGenre);
                const matchesAge = state.currentAge === 'all' || m.targetAge.includes(state.currentAge);
                const query = state.searchQuery.toLowerCase();
                const matchesSearch = m.title.toLowerCase().includes(query) || m.venue.toLowerCase().includes(query);
                const matchesWishlist = !state.showWishlistOnly || state.wishlist.has(m.id);
                
                return matchesGenre && matchesAge && matchesSearch && matchesWishlist;
            });

            if (state.showWishlistOnly) {
                viewTitle.innerText = "나의 마음함";
                viewSubtitle.innerText = "마음에 드는 공연들을 모두 모았습니다.";
            } else if (state.currentGenre !== 'all' || state.currentAge !== 'all' || state.searchQuery !== '') {
                viewTitle.innerText = "검색 결과";
                viewSubtitle.innerText = "필터링된 뮤지컬 목록을 확인하세요.";
            } else {
                viewTitle.innerText = "전체 공연 목록";
                viewSubtitle.innerText = "현재 상영 중이거나 예정인 뮤지컬을 확인하세요.";
            }

            if (filtered.length === 0) {
                musicalGrid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                musicalGrid.classList.remove('hidden');
                noResults.classList.add('hidden');
                musicalGrid.innerHTML = filtered.map(m => {
                    const isLiked = state.wishlist.has(m.id);
                    return `
                    <div class="musical-card rounded-[32px] overflow-hidden border border-slate-200 cursor-pointer shadow-sm group relative">
                        <div class="relative h-64 overflow-hidden" onclick="window.openModal(${m.id})">
                            <img src="${m.image}" alt="${m.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                            <div class="info-overlay absolute inset-0 bg-indigo-900/80 backdrop-blur-sm p-6 flex flex-col justify-center text-white z-10">
                                <p class="text-[10px] font-bold uppercase tracking-widest text-indigo-300 mb-2">공연 요약</p>
                                <p class="text-sm leading-relaxed mb-4 line-clamp-4">${m.description}</p>
                                <div class="flex items-center gap-2 mt-auto text-xs font-semibold text-white/80">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    런타임 ${m.duration}
                                </div>
                            </div>
                            <div class="absolute top-4 left-4 flex flex-wrap gap-1 z-20">
                                <span class="bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-md">${m.category}</span>
                            </div>
                        </div>
                        <button onclick="window.toggleLike(${m.id}, event)" class="heart-btn absolute top-4 right-4 z-30 bg-white/90 p-2 rounded-full shadow-md hover:bg-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${isLiked ? 'fill-pink-500 text-pink-500' : 'text-slate-400'}" fill="${isLiked ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                            </svg>
                        </button>
                        <div class="p-7 bg-white" onclick="window.openModal(${m.id})">
                            <p class="text-indigo-600 text-xs font-bold mb-1.5 uppercase tracking-wide">${m.genre}</p>
                            <h3 class="text-xl font-bold mb-3 text-slate-800 group-hover:text-indigo-600 transition-colors">${m.title}</h3>
                            <div class="flex items-center text-slate-400 text-xs gap-3">
                                <span class="flex items-center gap-1.5">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    </svg>
                                    ${m.venue}
                                </span>
                            </div>
                        </div>
                    </div>
                `; }).join('');
            }
        };

        const updateWishlistUI = () => {
            const wishlistToggle = document.getElementById('wishlistToggle');
            const wishlistCount = document.getElementById('wishlistCount');
            const wishlistIcon = document.getElementById('wishlistIcon');

            wishlistCount.innerText = state.wishlist.size;
            if (state.showWishlistOnly) {
                wishlistToggle.classList.add('bg-pink-600', 'text-white');
                wishlistToggle.classList.remove('bg-pink-50', 'text-pink-600');
                wishlistIcon.setAttribute('fill', 'white');
            } else {
                wishlistToggle.classList.remove('bg-pink-600', 'text-white');
                wishlistToggle.classList.add('bg-pink-50', 'text-pink-600');
                wishlistIcon.setAttribute('fill', 'none');
            }
        };

        window.toggleLike = async (id, event) => {
            if (event) event.stopPropagation();
            if (state.wishlist.has(id)) state.wishlist.delete(id);
            else state.wishlist.add(id);
            await updateWishlistInDb();
        };

        window.openModal = (id) => {
            const m = musicals.find(item => item.id === id);
            if (!m) return;
            const isLiked = state.wishlist.has(m.id);
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div class="flex flex-col md:flex-row">
                    <div class="md:w-5/12">
                        <img src="${m.image}" alt="${m.title}" class="w-full h-full object-cover min-h-[400px]">
                    </div>
                    <div class="md:w-7/12 p-10 flex flex-col relative">
                        <div class="mb-auto">
                            <div class="flex justify-between items-start mb-4 pr-12">
                                <div class="flex flex-wrap gap-2">
                                    <span class="text-indigo-600 font-bold text-[10px] tracking-widest uppercase border border-indigo-200 px-2 py-0.5 rounded">${m.category}</span>
                                    <span class="text-slate-500 font-bold text-[10px] tracking-widest uppercase border border-slate-200 px-2 py-0.5 rounded">${m.targetAge.join(', ')} 추천</span>
                                </div>
                                <button onclick="window.toggleLike(${m.id}); window.openModal(${m.id})" class="text-pink-500 hover:scale-110 transition-transform">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="${isLiked ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                    </svg>
                                </button>
                            </div>
                            <h2 class="text-3xl md:text-4xl font-extrabold mb-6 text-slate-900 leading-tight">${m.title}</h2>
                            <p class="text-slate-600 text-base leading-relaxed mb-8">${m.description}</p>
                            <div class="grid grid-cols-2 gap-8 py-6 border-y border-slate-100">
                                <div>
                                    <p class="text-slate-400 text-[10px] mb-1.5 uppercase tracking-widest font-bold">공연장소</p>
                                    <p class="text-sm font-semibold text-slate-800">${m.venue}</p>
                                </div>
                                <div>
                                    <p class="text-slate-400 text-[10px] mb-1.5 uppercase tracking-widest font-bold">공연시간</p>
                                    <p class="text-sm font-semibold text-slate-800">${m.duration}</p>
                                </div>
                            </div>
                        </div>
                        <a href="${m.bookingUrl}" target="_blank" class="w-full mt-10 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-indigo-100 flex items-center justify-center gap-2 group">
                            공식 예매처로 이동
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                            </svg>
                        </a>
                    </div>
                </div>
            `;
            document.getElementById('musicalModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.resetFilters = () => {
            state.currentGenre = 'all';
            state.currentAge = 'all';
            state.searchQuery = '';
            state.showWishlistOnly = false;
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.value === 'all') btn.classList.add('active-filter');
                else btn.classList.remove('active-filter');
            });
            updateWishlistUI();
            renderMusicals();
        };

        window.resetToAll = () => window.resetFilters();

        document.getElementById('wishlistToggle').addEventListener('click', () => {
            state.showWishlistOnly = !state.showWishlistOnly;
            updateWishlistUI();
            renderMusicals();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            state.showWishlistOnly = false;
            updateWishlistUI();
            renderMusicals();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                const value = btn.dataset.value;
                const group = type === 'genre' ? 'genreContainer' : 'ageContainer';
                document.getElementById(group).querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
                btn.classList.add('active-filter');
                if (type === 'genre') state.currentGenre = value;
                else state.currentAge = value;
                state.showWishlistOnly = false;
                updateWishlistUI();
                renderMusicals();
            });
        });

        document.getElementById('logoBtn').addEventListener('click', () => window.resetFilters());
        document.getElementById('resetFiltersBtn').addEventListener('click', () => window.resetFilters());
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('musicalModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                document.getElementById('musicalModal').classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });

        // 시작
        initializeFirebaseApp();
        renderMusicals();
    </script>
</body>
</html>
